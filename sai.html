<!DOCTYPE html>
<html>
<head>
    <title>College Website</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            text-align: center;
        }
        header {
            background: yellow;
            color: black;
            padding: 20px;
        }
        nav {
            background: lightred;
            padding: 15px;

        nav a {

            text-decoration: none;
        }

            background: lightgray;

            color: white;

        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College</h1>
        <p>Welcome to Our College</p>
    </header>

    <nav>

        <a href="#facilities">Facilities</a>

    </nav>

    <div class="box" id="about">
        <h2>About Us</h2>
        <p>Our college provides quality education.</p>
    </div>

    </div>

    <div class="box" id="facilities">
        <h2>Campus Facilities</h2>

    </div>

    <div class="box" id="contact">
        <h2>Contact Us</h2>
        <p>Email: NRIcollege@example.com</p>
    </div>

</body>
</html>
